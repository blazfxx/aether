name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-check:
    runs-on: macos-15          # Apple silicon; Package.swift needs Swift 6 tools (macos-14 has 5.10)
    steps:
      - uses: actions/checkout@v4
      - name: Engine checks
        run: swift run AetherCheck
      - name: Build the app
        run: Scripts/build_app.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Aether-macos
          path: build/Aether.app
